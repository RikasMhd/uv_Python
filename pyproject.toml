[project]
name = "uv-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RikasMhd", email = "rrikas341@email.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
]

[project.scripts]
uv-python = "uv_python:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
